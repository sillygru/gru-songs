name: Build APK

on:
  push:
    branches: [main, master]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    strategy:
      matrix:
        include:
          - target-platform: android-arm
            abi: armeabi-v7a
            artifact-name: wispie-armeabi-v7a-release
          - target-platform: android-arm64
            abi: arm64-v8a
            artifact-name: wispie-arm64-v8a-release

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode keystore and configure signing
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build release APK (${{ matrix.abi }})
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TELEMETRY_SECRET: ${{ secrets.TELEMETRY_SECRET }}
          WISPIE_ABI_FILTER: ${{ matrix.abi }}
        run: >
          flutter build apk
          --target-platform ${{ matrix.target-platform }}
          --dart-define=TELEMETRY_SECRET="$TELEMETRY_SECRET"
          --dart-define=GOOGLE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET"
          --obfuscate
          --split-debug-info=build/debug-info

      - name: Rename APK for upload
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/${{ matrix.artifact-name }}.apk

      - name: Upload APK (${{ matrix.abi }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: build/app/outputs/flutter-apk/${{ matrix.artifact-name }}.apk
          retention-days: 7
